name: Machine Learning CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-train:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Membangun_model/requirements.txt

    - name: Run MLflow Project Check
      run: |
        pip install mlflow
        # Memicu local run eksperimen untuk memverifikasi fungsionalitas kode tanpa error
        mlflow run . --experiment-name="CI_Testing" --backend local
